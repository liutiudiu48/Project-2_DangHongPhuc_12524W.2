<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Quản trị – SportZone</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@600;700&display=swap" rel="stylesheet">
  <link href="css/style.css" rel="stylesheet">
</head>
<body data-page="admin">
  <header id="site-header"></header>

  <main class="container py-4" id="app">
    <h1>Quản trị cửa hàng</h1>

    <ul class="nav nav-tabs mb-3">
      <li class="nav-item"><button class="nav-link active" data-bs-toggle="tab" data-bs-target="#t1">Sản phẩm</button></li>
      <li class="nav-item"><button class="nav-link" data-bs-toggle="tab" data-bs-target="#t2">Đơn hàng</button></li>
    </ul>

    <div class="tab-content">
      <!-- Tab sản phẩm -->
      <div class="tab-pane fade show active" id="t1">
        <div class="mb-3">
          <button id="addp" class="btn btn-main">Thêm sản phẩm mới</button>
          <button id="reset" class="btn btn-outline-secondary">Khôi phục dữ liệu mẫu</button>
        </div>
        <div class="table-responsive">
          <table class="table align-middle">
            <thead><tr><th></th><th>Tên</th><th>Môn</th><th>Giá</th><th></th></tr></thead>
            <tbody id="tp"></tbody>
          </table>
        </div>
      </div>

      <!-- Tab đơn hàng -->
      <div class="tab-pane fade" id="t2">
        <div class="table-responsive">
          <table class="table align-middle">
            <thead><tr><th>Mã đơn</th><th>Khách hàng</th><th>Sản phẩm</th><th>Tổng tiền</th><th>Trạng thái</th></tr></thead>
            <tbody id="to"></tbody>
          </table>
        </div>
      </div>
    </div>

    <!-- Cửa sổ thêm / sửa sản phẩm -->
    <div class="modal fade" id="pmod">
      <div class="modal-dialog">
        <form id="pf" class="modal-content">
          <input type="hidden" id="pid">
          <div class="modal-header">
            <h2 class="h5 modal-title">Thông tin sản phẩm</h2>
            <button type="button" class="btn-close" data-bs-dismiss="modal"></button>
          </div>
          <div class="modal-body">
            <input id="pn" class="form-control mb-2" placeholder="Tên sản phẩm">
            <select id="pc" class="form-select mb-2"></select>
            <input id="pp" type="number" class="form-control mb-2" placeholder="Giá bán (₫)">
            <input id="pmat" class="form-control mb-2" placeholder="Chất liệu">
            <input id="ps" class="form-control mb-2" placeholder="Size, cách nhau bằng dấu phẩy: S,M,L">
            <textarea id="pd" class="form-control" placeholder="Mô tả"></textarea>
          </div>
          <div class="modal-footer">
            <button class="btn btn-main">Lưu sản phẩm</button>
          </div>
        </form>
      </div>
    </div>
  </main>

  <footer id="site-footer"></footer>

  <script src="https://code.jquery.com/jquery-3.7.1.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
  <script src="js/products.js"></script>
  <script src="js/main.js"></script>
</body>
</html>
