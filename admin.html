<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Quản trị – SportZone</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@600;700&display=swap" rel="stylesheet">
  <link href="css/style.css" rel="stylesheet">
</head>
<body data-page="admin">
  <div class="container-fluid">
    <div class="row">

      <!-- Menu bên trái -->
      <aside class="col-md-2 adm-side p-3">
        <a class="brand fs-4 text-decoration-none d-block mb-3" href="admin.html">Sport<b>Zone</b> <small class="fs-6 text-secondary">Quản trị</small></a>
        <nav class="nav flex-row flex-md-column gap-1" id="adm-nav">
          <button class="nav-link text-start active" data-view="dash">Tổng quan</button>
          <button class="nav-link text-start" data-view="prod">Sản phẩm</button>
          <button class="nav-link text-start" data-view="order">Đơn hàng</button>
          <a class="nav-link text-start" href="index.html">Xem website</a>
        </nav>
      </aside>

      <!-- Nội dung -->
      <main class="col-md-10 p-4" id="app">

        <section id="v-dash" class="view">
          <h1>Tổng quan</h1>
          <div class="row g-3 mb-4" id="stats"></div>
          <h2 class="h5">Đơn hàng gần đây</h2>
          <div class="table-responsive">
            <table class="table align-middle">
              <thead><tr><th>Mã đơn</th><th>Khách hàng</th><th>Tổng tiền</th><th>Trạng thái</th></tr></thead>
              <tbody id="recent"></tbody>
            </table>
          </div>
        </section>

        <section id="v-prod" class="view d-none">
          <h1>Quản lý sản phẩm</h1>
          <div class="mb-3">
            <button id="addp" class="btn btn-main">Thêm sản phẩm mới</button>
            <button id="reset" class="btn btn-outline-secondary">Khôi phục dữ liệu mẫu</button>
          </div>
          <div class="table-responsive">
            <table class="table align-middle">
              <thead><tr><th></th><th>Tên</th><th>Môn</th><th>Giá</th><th></th></tr></thead>
              <tbody id="tp"></tbody>
            </table>
          </div>
        </section>

        <section id="v-order" class="view d-none">
          <h1>Quản lý đơn hàng</h1>
          <div class="table-responsive">
            <table class="table align-middle">
              <thead><tr><th>Mã đơn</th><th>Khách hàng</th><th>Sản phẩm</th><th>Tổng tiền</th><th>Trạng thái</th></tr></thead>
              <tbody id="to"></tbody>
            </table>
          </div>
        </section>

        <!-- Cửa sổ thêm / sửa sản phẩm -->
        <div class="modal fade" id="pmod">
          <div class="modal-dialog">
            <form id="pf" class="modal-content">
              <input type="hidden" id="pid">
              <div class="modal-header">
                <h2 class="h5 modal-title">Thông tin sản phẩm</h2>
                <button type="button" class="btn-close" data-bs-dismiss="modal"></button>
              </div>
              <div class="modal-body">
                <input id="pn" class="form-control mb-2" placeholder="Tên sản phẩm">
                <select id="pc" class="form-select mb-2"></select>
                <input id="pp" type="number" class="form-control mb-2" placeholder="Giá bán (₫)">
                <input id="pmat" class="form-control mb-2" placeholder="Chất liệu">
                <input id="ps" class="form-control mb-2" placeholder="Size, cách nhau bằng dấu phẩy: S,M,L">
                <textarea id="pd" class="form-control" placeholder="Mô tả"></textarea>
              </div>
              <div class="modal-footer">
                <button class="btn btn-main">Lưu sản phẩm</button>
              </div>
            </form>
          </div>
        </div>

      </main>
    </div>
  </div>

  <script src="https://code.jquery.com/jquery-3.7.1.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
  <script src="js/products.js"></script>
  <script src="js/main.js"></script>
</body>
</html>
